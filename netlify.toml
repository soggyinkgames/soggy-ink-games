# 1. Proxy Astro build assets (CSS, JS)
[[redirects]]
  from = "/_astro/*"
  to = "https://soggyinkgames-investors.netlify.app/_astro/:splat"
  status = 200
  force = true

# 2. Catch root-level CSS/JS assets generated by Astro
[[redirects]]
  from = "/*.css"
  to = "https://soggyinkgames-investors.netlify.app/:splat"
  status = 200
  force = true

# 3. Proxy exact /investors path
[[redirects]]
  from = "/investors"
  to = "https://soggyinkgames-investors.netlify.app/"
  status = 200
  force = true

# 4. Proxy all sub-paths (/investors/login, /investors/dashboard, etc.)
[[redirects]]
  from = "/investors/*"
  to = "https://soggyinkgames-investors.netlify.app/:splat"
  status = 200
  force = true